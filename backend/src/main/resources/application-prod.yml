server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: lms-catalogue
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lms_catalog}
    username: ${SPRING_DATASOURCE_USERNAME:lms_app}
    password: ${SPRING_DATASOURCE_PASSWORD:lms_app_password}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/demo
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.globallearning: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
