app = "lms-catalogue"
primary_region = "sjc"

[build]
  builder = "docker"
  dockerfile = "./backend/Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "prod"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "requests"
    hard_limit = 1000
    soft_limit = 800

[checks]
  [checks.http]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/actuator/health"
    protocol = "http"
    timeout = "10s"
