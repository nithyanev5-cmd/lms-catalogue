version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: lms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lms_catalog
      MYSQL_USER: lms_app
      MYSQL_PASSWORD: lms_app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-setup/01-create-users.sql:/docker-entrypoint-initdb.d/01-create-users.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      interval: 10s
    networks:
      - lms-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lms-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lms_catalog
      SPRING_DATASOURCE_USERNAME: lms_app
      SPRING_DATASOURCE_PASSWORD: lms_app_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_PROFILES_ACTIVE: default
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lms-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:8080
    depends_on:
      - backend
    networks:
      - lms-network

volumes:
  mysql_data:

networks:
  lms-network:
    driver: bridge
